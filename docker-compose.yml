services:

  api:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - otris_data:/data
      - ./queue:/app/queue
      - ./output:/app/output
    restart: unless-stopped

  portrait-api:
    build: .
    command: ["uvicorn", "portrait_api.app:app", "--host", "0.0.0.0", "--port", "8090"]
    working_dir: /app
    ports:
      - "8090:8090"
    env_file:
      - .env
    environment:
      PORTRAIT_FALLBACK: "1"
    restart: unless-stopped

  bot:
    build: .
    command: ["python", "vu-qa-bot/vu_qa_bot.py"]
    working_dir: /app
    env_file:
      - .env
    volumes:
      - otris_data:/data
      - ./queue:/app/queue
      - ./output:/app/output
    environment:
      PROFILES_PATH: /data/profiles.json
      RENDER_QUEUE_DIR: /app/queue
      RENDER_OUTPUT_DIR: /app/output
      PORTRAIT_API_URL: http://portrait-api:8090/generate
    restart: unless-stopped
    depends_on:
      - api
      - portrait-api

  # Render-worker: только Windows-хост с установленным Photoshop.
  # docker compose --profile render up render-worker
  render-worker:
    profiles: ["render"]
    build: .
    command: ["python", "vu-qa-bot/render_worker.py"]
    working_dir: /app
    env_file:
      - .env
    volumes:
      - ./queue:/app/queue
      - ./output:/app/output
      - ./photoshop:/app/photoshop
    environment:
      RENDER_QUEUE_DIR: /app/queue
      RENDER_OUTPUT_DIR: /app/output
      PORTRAIT_API_URL: http://portrait-api:8090/generate
    restart: unless-stopped
    depends_on:
      - portrait-api

volumes:
  otris_data:
